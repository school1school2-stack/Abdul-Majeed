<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة المدرسية الشاملة - أ. عبدالعزيز الفيفي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ربط سحابة abdalmged-6b97e -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLDay0Kpfwq8vvDMXSqvXeH1Z3r941mrs",
            authDomain: "abdalmged-6b97e.firebaseapp.com",
            databaseURL: "https://abdalmged-6b97e-default-rtdb.firebaseio.com",
            projectId: "abdalmged-6b97e",
            storageBucket: "abdalmged-6b97e.firebasestorage.app",
            messagingSenderId: "15647765856",
            appId: "1:15647765856:web:454432fdf5a28bfeOddaO5",
            measurementId: "G-D4ZM5NK4FE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.doc = doc;
        window.FirestoreFunctions = { doc, setDoc, getDoc, collection, getDocs, deleteDoc, onSnapshot, updateDoc };

        window.saveToCloud = async function(data, docId = 'main_data') {
            try {
                await setDoc(doc(db, "user_data", docId), {
                    ...data,
                    updatedAt: new Date().toISOString()
                });
                return true;
            } catch (error) {
                console.error("خطأ أثناء الحفظ:", error);
                alert("خطأ سحابي: " + error.message);
                return false;
            }
        };

        window.loadFromCloud = async function(docId = 'main_data') {
            try {
                const docRef = doc(db, "user_data", docId);
                const docSnap = await getDoc(docRef);
                return docSnap.exists() ? docSnap.data() : null;
            } catch (error) {
                console.error("خطأ أثناء الجلب:", error);
                return null;
            }
        };
    </script>

    <style>
        :root { 
            --maroon: #800000; --gold: #d4af37; --bg: #fdfaf1; --danger: #c62828; 
            --success: #28a745; --info: #17a2b8; --accent: #0284c7; --text-main: #1e293b;
            --primary: #1e3a8a; --card-bg: #ffffff; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; color: var(--text-main); }
        
        .auth-card { background: white; max-width: 450px; margin: 80px auto; border-radius: 15px; padding: 35px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); border-top: 8px solid var(--maroon); text-align: center; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; text-align: center; outline: none; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { opacity: 0.9; }
        .btn-main { background: var(--maroon); width: 100%; padding: 12px; font-size: 1.1rem; }

        .admin-panel, .teacher-dashboard { display: none; background: white; max-width: 1200px; margin: auto; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); border-top: 8px solid var(--maroon); }
        .header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 10px; }
        .section-box { background: #f4f4f4; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px dashed var(--maroon); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th { background: var(--maroon); color: var(--gold); padding: 12px; font-size: 0.9rem; }
        td { border-bottom: 1px solid #eee; padding: 10px; text-align: center; vertical-align: middle; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div class="auth-card" id="loginScreen">
        <h2 style="color: var(--maroon); margin-top:0;"><i class="fas fa-school"></i> بوابة المنصة المدرسية</h2>
        <p style="color: #666; font-size: 0.95rem;">أدخل إيميلك للدخول (الإداري أو معلم):</p>
        <input type="email" id="loginEmail" class="input-field" placeholder="t486739@rb.moe.gov.sa" value="t486739@rb.moe.gov.sa">
        <button class="btn btn-main" onclick="verifyLogin()">دخول المنصة 🚀</button>
        <p id="loginMsg" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- 2. لوحة تحكم المدير -->
    <div class="admin-panel" id="adminScreen">
        <div class="header">
            <h2 style="color: var(--maroon);">لوحة التحكم الشاملة (أ. عبدالعزيز الفيفي) 🔒</h2>
            <button class="btn" style="background: var(--danger); margin-top:10px;" onclick="location.reload()">تسجيل خروج</button>
        </div>

        <div class="section-box">
            <h3>👨‍🏫 إدارة المعلمين</h3>
            <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
                <input type="text" id="tName" class="input-field" placeholder="اسم المعلم" style="flex:1; margin:0;">
                <input type="text" id="tSubject" class="input-field" placeholder="المادة" style="flex:1; margin:0;" value="الكفايات اللغوية">
                <input type="email" id="tEmail" class="input-field" placeholder="البريد الإلكتروني للمعلم" style="flex:1; margin:0;">
                <button class="btn" style="background: var(--success);" onclick="saveTeacher()">حفظ المعلم 🌟</button>
            </div>
            <table id="teachersTable" style="margin-top:20px;">
                <thead><tr><th>اسم المعلم</th><th>المادة</th><th>البريد الإلكتروني</th><th>الإجراءات</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

<script>
    const adminEmail = "t486739@rb.moe.gov.sa";

    async function verifyLogin() {
        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        if(email === adminEmail || email.includes("admin")) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminScreen').style.display = 'block';
            loadAdminData();
        } else {
            alert("يرجى استخدام إيميل المدير للدخول للوحة الإدارة.");
        }
    }

    async function saveTeacher() {
        const name = document.getElementById('tName').value.trim();
        const subject = document.getElementById('tSubject').value.trim();
        const email = document.getElementById('tEmail').value.trim().toLowerCase();
        
        if(!name || !subject || !email) {
            alert("الرجاء تعبئة جميع الحقول!");
            return;
        }

        try {
            // تحويل الإيميل لمعرّف آمن
            const safeDocId = email.replace(/[@.]/g, "_");
            const docRef = window.doc(window.db, "allowed_teachers", safeDocId);
            
            await window.FirestoreFunctions.setDoc(docRef, { name, subject, email });
            alert("تم حفظ المعلم بنجاح! 🌟");
            
            document.getElementById('tName').value = "";
            document.getElementById('tSubject').value = "الكفايات اللغوية";
            document.getElementById('tEmail').value = "";
            loadAdminData();
        } catch(e) {
            console.error(e);
            alert("تفاصيل الخطأ: " + e.message);
        }
    }

    async function loadAdminData() {
        const tTbody = document.querySelector("#teachersTable tbody");
        tTbody.innerHTML = "<tr><td colspan='4'>جاري التحميل...</td></tr>";
        try {
            const querySnapshot = await window.FirestoreFunctions.getDocs(window.FirestoreFunctions.collection(window.db, "allowed_teachers"));
            tTbody.innerHTML = "";
            querySnapshot.forEach((documentSnapshot) => {
                const d = documentSnapshot.data();
                tTbody.innerHTML += `
                    <tr>
                        <td><b>${d.name}</b></td>
                        <td>${d.subject}</td>
                        <td>${d.email}</td>
                        <td><button class="btn" style="background:var(--danger); padding:4px 8px;" onclick="deleteTeacher('${documentSnapshot.id}')">حذف</button></td>
                    </tr>`;
            });
        } catch(e) {
            tTbody.innerHTML = `<tr><td colspan='4' style='color:red;'>خطأ في الجلب: ${e.message}</td></tr>`;
        }
    }

    async function deleteTeacher(docId) {
        if(confirm("حذف المعلم؟")) {
            await window.FirestoreFunctions.deleteDoc(window.doc(window.db, "allowed_teachers", docId));
            loadAdminData();
        }
    }
</script>
</body>
</html>
