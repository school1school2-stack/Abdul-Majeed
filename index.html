<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المعلمين - النسخة المعتمدة بمعزل سحابي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { 
            --royal-blue: #1e3a8a; --q-red: #ef4444; --bg-page: #f8fafc; 
            --success-green: #10b981; --k-purple: #7c3aed; --card-border: #e2e8f0;
            --text-color: #1e293b; --card-bg: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-page); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }
        .btn { border: none; padding: 10px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; font-family: inherit; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .auth-input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #cbd5e1; margin-bottom: 12px; font-size: 1rem; outline: none; box-sizing: border-box; font-family: inherit; }
        
        .styled-dropdown-wrapper { position: relative; display: inline-block; }
        .dropdown-toggle-btn { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .dropdown-menu-content { display: none; position: absolute; left: 0; top: calc(100% + 5px); background: #1e293b; min-width: 170px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); border-radius: 10px; z-index: 1000; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .styled-dropdown-wrapper.active .dropdown-menu-content { display: block; }
        .dropdown-menu-content button { width: 100%; background: transparent; border: none; color: white; padding: 10px 14px; text-align: right; font-family: inherit; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dropdown-menu-content button:hover { background: rgba(255, 255, 255, 0.1); }

        .teachers-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .teachers-table th, .teachers-table td { padding: 12px; border: 1px solid #e2e8f0; text-align: center; font-size: 0.9rem; }
        .teachers-table th { background: #f1f5f9; color: var(--royal-blue); }
    </style>
</head>
<body>

    <!-- لوحة المشرف العامة لإدارة المعلمين -->
    <div class="card" id="admin-control-panel">
        <h2 style="color: var(--royal-blue); margin-top: 0; text-align: center;"><i class="fas fa-chalkboard-teacher"></i> لوحة تحكم المشرف (إدارة المعلمين)</h2>
        
        <div style="background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 20px;">
            <h3 style="margin-top: 0; color: #0284c7; font-size: 1.1rem;"><i class="fas fa-user-plus"></i> إضافة معلم جديد للنظام:</h3>
            <input type="text" id="newTeacherName" class="auth-input" placeholder="اسم المعلم (مثال: أ. عبدالعزيز الفيفي)">
            <input type="email" id="newTeacherEmail" class="auth-input" placeholder="إيميل المعلم (مثال: teacher@moe.gov.sa)">
            <input type="text" id="newTeacherSubject" class="auth-input" placeholder="المادة الدراسية (مثال: الكفايات اللغوية)">
            <button class="btn" style="background: var(--success-green); width: 100%; justify-content: center;" onclick="addNewTeacher()"><i class="fas fa-save"></i> حفظ وإضافة المعلم</button>
        </div>

        <h3 style="color: var(--royal-blue); font-size: 1.1rem;"><i class="fas fa-users"></i> المعلمون المسجلون في المنصة:</h3>
        <div style="overflow-x: auto;">
            <table class="teachers-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم المعلم</th>
                        <th>البريد الإلكتروني</th>
                        <th>المادة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="teachers-table-body">
                    <tr><td colspan="5" style="color: #64748b;">جاري تحميل المعلمين...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- واجهة المعلم المستقلة (تظهر تلقائياً عندما يدخل المعلم برابطه الخاص أو يضغط فتح) -->
    <div class="card" id="teacher-workspace" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--royal-blue); padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <div>
                <h2 id="current-teacher-title" style="margin: 0; color: var(--royal-blue); font-size: 1.2rem;">لوحة المعلم</h2>
                <p id="current-teacher-sub" style="margin: 0; color: #64748b; font-size: 0.9rem;"></p>
            </div>
            <button class="btn" id="return-admin-btn" style="background: #64748b; display: none;" onclick="returnToAdminPanel()"><i class="fas fa-arrow-right"></i> عودة للوحة المشرف</button>
        </div>
        
        <div>
            <div style="background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 20px;">
                <h4 style="margin-top: 0; color: var(--royal-blue);"><i class="fas fa-plus-circle"></i> إضافة نموذج / اختبار جديد لهذا المعلم:</h4>
                <input type="text" id="modelNameInput" class="auth-input" placeholder="اسم النموذج أو الاختبار (مثال: اختبار الوحدة الأولى)">
                <button class="btn" style="background: var(--success-green);" onclick="saveTeacherModel()"><i class="fas fa-save"></i> حفظ في مجلدي السحابي</button>
            </div>

            <h4 style="color: #0284c7;"><i class="fas fa-folder-open"></i> النماذج والاختبارات الخاصة بهذا المعلم فقط:</h4>
            <div id="teacher-models-list" style="background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0;">
                <p style="color: #64748b; text-align: center;">جاري تحميل النماذج...</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVrIim7aXjg0hGrMk0qVrXT8geRIpHoBk",
            authDomain: "youy-apps.firebaseapp.com",
            databaseURL: "https://youy-apps-default-rtdb.firebaseio.com",
            projectId: "youy-apps"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        let currentActiveEmail = "";

        window.addEventListener('click', function() {
            document.querySelectorAll('.styled-dropdown-wrapper').forEach(w => w.classList.remove('active'));
        });

        function toggleDropdown(event, el) {
            event.stopPropagation();
            const wrapper = el.closest('.styled-dropdown-wrapper');
            document.querySelectorAll('.styled-dropdown-wrapper').forEach(w => {
                if (w !== wrapper) w.classList.remove('active');
            });
            wrapper.classList.toggle('active');
        }

        // تحميل قائمة المعلمين للمشرف
        function loadTeachers() {
            rtdb.ref('teachers').on('value', snapshot => {
                const tbody = document.getElementById('teachers-table-body');
                if (!tbody) return;
                tbody.innerHTML = "";
                const data = snapshot.val();

                if (!data) {
                    tbody.innerHTML = `<tr><td colspan="5" style="color: #64748b;">لا يوجد معلمون مسجلون حالياً.</td></tr>`;
                    return;
                }

                let index = 1;
                Object.keys(data).forEach(encodedKey => {
                    const teacher = data[encodedKey];
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>${index++}</td>
                        <td style="font-weight: bold; color: var(--royal-blue);">${teacher.name}</td>
                        <td style="direction: ltr;">${teacher.email}</td>
                        <td>${teacher.subject}</td>
                        <td>
                            <div class="styled-dropdown-wrapper">
                                <button type="button" class="dropdown-toggle-btn" onclick="toggleDropdown(event, this)">
                                    خيارات <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>
                                </button>
                                <div class="dropdown-menu-content">
                                    <button type="button" onclick="openTeacherWorkspace('${teacher.email}', '${teacher.name}', '${teacher.subject}')"><i class="fas fa-folder-open" style="color:#10b981;"></i> فتح حسابه</button>
                                    <button type="button" onclick="shareTeacherLink('${teacher.email}')"><i class="fas fa-share-alt" style="color:#06b6d4;"></i> مشاركة الرابط</button>
                                    <button type="button" onclick="deleteTeacher('${encodedKey}')"><i class="fas fa-trash" style="color:#ef4444;"></i> حذف</button>
                                </div>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // إضافة معلم جديد للسحابة
        async function addNewTeacher() {
            const name = document.getElementById('newTeacherName').value.trim();
            const email = document.getElementById('newTeacherEmail').value.trim().toLowerCase();
            const subject = document.getElementById('newTeacherSubject').value.trim();

            if (!name || !email || !subject || !email.includes('@')) {
                alert("الرجاء إدخال اسم المعلم، الإيميل الصحيح، والمادة بشكل كامل.");
                return;
            }

            const safeEmailKey = email.replace(/\./g, '_');

            try {
                await rtdb.ref('teachers/' + safeEmailKey).set({
                    name: name,
                    email: email,
                    subject: subject,
                    createdAt: new Date().toLocaleString()
                });

                alert("تم حفظ المعلم في السحابة بنجاح! 💾");
                document.getElementById('newTeacherName').value = "";
                document.getElementById('newTeacherEmail').value = "";
                document.getElementById('newTeacherSubject').value = "";
            } catch (err) {
                alert("حدث خطأ أثناء الحفظ بالسحابة.");
            }
        }

        async function deleteTeacher(encodedKey) {
            if (confirm("⚠️ هل أنت متأكد من حذف هذا المعلم نهائياً؟")) {
                try {
                    await rtdb.ref('teachers/' + encodedKey).remove();
                    alert("تم الحذف بنجاح.");
                } catch(e) {
                    alert("حدث خطأ أثناء الحذف.");
                }
            }
        }

        // توليد رابط مخصص لكل معلم يحتوي على الإيميل
        function shareTeacherLink(email) {
            const shareUrl = window.location.origin + window.location.pathname + "?teacher=" + encodeURIComponent(email);
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert(`تم نسخ رابط المعلم الخاص بنجاح! 🔗\n${shareUrl}`);
            });
        }

        // فتح واجهة المعلم وعزل مجلده السحابي
        function openTeacherWorkspace(email, name, subject, showReturnBtn = true) {
            currentActiveEmail = email;
            document.getElementById('admin-control-panel').style.display = 'none';
            document.getElementById('teacher-workspace').style.display = 'block';
            if (showReturnBtn) {
                document.getElementById('return-admin-btn').style.display = 'inline-flex';
            }

            document.getElementById('current-teacher-title').innerText = `المعلم: ${name}`;
            document.getElementById('current-teacher-sub').innerText = `المادة: ${subject} | البريد: ${email} (مجلد سحابي مستقل)`;

            loadTeacherModels(email);
        }

        // تحميل نماذج المعلم المخصصة من مجلده السحابي فقط
        function loadTeacherModels(email) {
            const safeEmailKey = email.replace(/\./g, '_');
            rtdb.ref(`teacher_models/${safeEmailKey}`).on('value', snapshot => {
                const listDiv = document.getElementById('teacher-models-list');
                listDiv.innerHTML = "";
                const models = snapshot.val();

                if (!models) {
                    listDiv.innerHTML = `<p style="color: #64748b; text-align: center; margin: 0;">لا توجد نماذج مسجلة لهذا المعلم حتى الآن في مجلده السحابي المستقل.</p>`;
                    return;
                }

                Object.keys(models).forEach(modelName => {
                    const item = document.createElement('div');
                    item.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e2e8f0;";
                    item.innerHTML = `
                        <span style="font-weight: bold; color: var(--royal-blue);">${modelName}</span>
                        <span style="font-size: 0.85rem; color: #10b981; font-weight: bold;"><i class="fas fa-cloud"></i> مخزن في سحابة الإيميل حصرياً</span>
                    `;
                    listDiv.appendChild(item);
                });
            });
        }

        // حفظ نموذج جديد في مجلند المعلم السحابي الخاص
        async function saveTeacherModel() {
            const modelName = document.getElementById('modelNameInput').value.trim();
            if (!modelName) {
                alert("الرجاء إدخال اسم النموذج أولاً.");
                return;
            }

            const safeEmailKey = currentActiveEmail.replace(/\./g, '_');
            try {
                await rtdb.ref(`teacher_models/${safeEmailKey}/${modelName}`).set({
                    createdAt: new Date().toLocaleString()
                });
                alert(`تم حفظ نموذج "${modelName}" في مجلدك السحابي بنجاح! 💾`);
                document.getElementById('modelNameInput').value = "";
            } catch(e) {
                alert("حدث خطأ أثناء الحفظ.");
            }
        }

        function returnToAdminPanel() {
            window.location.href = window.location.pathname; // العودة للوحة المشرف الرئيسية بدون بارامتر المعلم
        }

        // فحص الرابط عند الفتح: إذا كان الرابط يحتوي على إيميل المعلم، يتم فتح صفحته ومجلة السحابي مباشرة
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const teacherEmailParam = urlParams.get('teacher');

            if (teacherEmailParam) {
                // إذا دخل المعلم من رابطه الخاص، نبحث عن بياناته في قاعدة البيانات ونفتح صفحته حصرياً
                const safeKey = teacherEmailParam.trim().toLowerCase().replace(/\./g, '_');
                rtdb.ref('teachers/' + safeKey).once('value', snapshot => {
                    if (snapshot.exists()) {
                        const tData = snapshot.val();
                        openTeacherWorkspace(tData.email, tData.name, tData.subject, false); // إخفاء زر العودة للمشرف
                    } else {
                        alert("عذراً، هذا الرابط غير صحيح أو تم حذف حساب المعلم.");
                        window.location.href = window.location.pathname;
                    }
                });
            } else {
                // إذا كان المستخدم هو المشرف
                loadTeachers();
            }
        };
    </script>
</body>
</html>
