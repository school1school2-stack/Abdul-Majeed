    <style>
        :root { 
            --royal-blue: #1e3a8a; --q-red: #ef4444; --bg-page: #f8fafc; 
            --success-green: #10b981; --k-purple: #7c3aed; --card-border: #e2e8f0;
            --text-color: #1e293b; --card-bg: #ffffff;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial; 
            background: var(--bg-page); color: var(--text-color); margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; line-height: 1.6;
            transition: background 0.5s ease, color 0.5s ease;
            box-sizing: border-box;
        }

        .user-header {
            width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 5px solid var(--royal-blue); 
            margin-bottom: 20px; box-sizing: border-box; gap: 15px; flex-wrap: wrap; transition: background 0.5s;
        }
        .header-right { flex: 1; text-align: right; min-width: 140px; }
        .header-center { flex: 0 0 auto; display: flex; justify-content: center; }
        .header-left { flex: 1; text-align: left; min-width: 140px; }

        .user-name { margin: 0; color: var(--royal-blue); font-weight: bold; font-size: 1.3rem; }
        .school-name { margin: 0; color: #64748b; font-weight: bold; font-size: 0.95rem; }
        .logo-box { background: var(--royal-blue); width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.4rem; transition: background 0.5s; }

        .top-action-bar {
            width: 100%; max-width: 850px; background: #1e293b; border-radius: 15px; padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px; box-sizing: border-box; gap: 12px; flex-wrap: wrap; z-index: 999;
        }
        .bar-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .styled-dropdown-wrapper { position: relative; display: inline-block; }

        .dropdown-toggle-btn {
            background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 20px;
            font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; font-family: inherit; font-size: 0.9rem; white-space: nowrap; transition: 0.3s;
        }
        .dropdown-toggle-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .dropdown-toggle-btn i:first-child { font-size: 1.15rem; }
        .dropdown-toggle-btn .fa-chevron-down { font-size: 0.75rem; transition: transform 0.3s; margin-right: 4px; }
        
        .styled-dropdown-wrapper.active .fa-chevron-down { transform: rotate(180deg); }

        .dropdown-menu-content {
            display: none; position: absolute; right: 0; top: calc(100% + 8px); background: #1e293b;
            min-width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); border-radius: 12px; z-index: 1000;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.1); animation: fadeInMenu 0.2s ease;
        }

        @keyframes fadeInMenu {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-menu-content button {
            width: 100%; background: transparent; border: none; color: white; padding: 11px 16px;
            text-align: right; font-family: inherit; font-size: 0.9rem; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: background 0.2s; white-space: nowrap;
        }
        .dropdown-menu-content button i { font-size: 1.15rem; width: 20px; text-align: center; }
        .dropdown-menu-content button:hover { background: rgba(255, 255, 255, 0.1); }

        .styled-dropdown-wrapper.active .dropdown-menu-content { display: block; }

        .btn { border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; font-family: inherit; font-size: 0.9rem; white-space: nowrap; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-clear { background: #64748b; padding: 10px; border-radius: 50%; width: 40px; height: 40px; }

        .array-import-box, .search-result-box {
            width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px dashed #0284c7; margin-bottom: 25px; box-sizing: border-box;
        }
        .array-textarea {
            width: 100% !important; height: 180px !important; max-height: 180px !important; padding: 12px;

            direction: ltr; text-align: left; outline: none; box-sizing: border-box; resize: none !important;
            overflow-y: auto !important; margin-bottom: 10px;
        }

        .auth-card {
            background: var(--card-bg); width: 100%; max-width: 850px; border-radius: 20px; padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; margin-bottom: 25px;
        }
        .auth-input, .styled-select-input { width: 80%; max-width: 400px; padding: 15px; border-radius: 10px; border: 2px solid #cbd5e1; margin-bottom: 15px; text-align: center; font-size: 1.1rem; outline: none; box-sizing: border-box; font-family: inherit; background: #fff; }

        .container { width: 100%; max-width: 850px; padding-bottom: 120px; display: none; box-sizing: border-box; }
        
        .exam-timer-banner {
            width: 100%; max-width: 850px; background: #1e293b; color: #38bdf8; border-radius: 12px;
            padding: 12px 20px; margin-bottom: 20px; display: none; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-weight: bold; box-sizing: border-box; flex-wrap: wrap; gap: 10px;
        }

        .question-card { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 2px solid var(--card-border); position: relative; text-align: right; box-sizing: border-box; }
        .question-card::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: var(--k-purple); border-radius: 0 10px 10px 0; }
        
        .question-card.unanswered-alert { border: 2px solid var(--q-red) !important; background-color: #fff5f5; }
        .question-card.unanswered-alert .q-number-badge { background-color: var(--q-red) !important; }

        .card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: space-between; }
        .q-number-badge { background: var(--k-purple); color: white; padding: 4px 15px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; }
        .type-select { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 10px; font-weight: bold; font-family: inherit; cursor: pointer; color: var(--royal-blue); outline: none; }

        .estieab-box { background: #fff9c4 !important; border: 2px solid #fbc02d; border-radius: 12px; padding: 15px; margin-bottom: 15px; color: #000; font-weight: bold; line-height: 1.8; width: 100%; box-sizing: border-box; text-align: right; min-height: 90px; outline: none; white-space: pre-wrap; font-size: 1.15rem; }
        
        .q-text-input { 
            width: 100%; min-height: 60px; padding: 12px; border: 2px solid #cbd5e1; border-radius: 12px; 
            color: inherit; font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; outline: none; 
            text-align: right; box-sizing: border-box; word-wrap: break-word; font-family: inherit; 
            background: rgba(0,0,0,0.02); line-height: 1.7; resize: none; 
        }

        .student-answer-textarea {
            width: 100%; min-height: 80px; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px;
            font-family: inherit; font-size: 1.05rem; outline: none; box-sizing: border-box; text-align: right; background: #fff;
        }

        .matching-container, .enumeration-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        @media (max-width: 768px) { .matching-container, .enumeration-container { grid-template-columns: 1fr; } }
        .matching-box, .enumeration-box { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; border-radius: 12px; box-sizing: border-box; }
        .matching-row, .enum-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
        .matching-row input[type="text"] { flex: 1; min-width: 100px; }
